<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root { --stage-h: 900px; --card-h: 400px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:var(--stage-h); }
  body {
    font-family:'Noto Sans TC','WenQuanYi Zen Hei',sans-serif;
    background:#fff; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .stage {
    position:relative; width:1200px; height:var(--stage-h); overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:54px 64px 56px;
    background:
      radial-gradient(840px 480px at 90% 4%, rgba(139,92,246,.14), transparent 62%),
      radial-gradient(840px 480px at 6% 98%, rgba(59,130,246,.14), transparent 60%),
      linear-gradient(160deg,#ffffff 0%,#f6f8fc 55%,#eef2f9 100%);
  }
  .stage::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(15,23,42,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(15,23,42,.045) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(150deg, rgba(0,0,0,.85), rgba(0,0,0,.12) 55%, transparent);
    -webkit-mask-image:linear-gradient(150deg, rgba(0,0,0,.85), rgba(0,0,0,.12) 55%, transparent);
  }
  .accent { position:absolute; top:0; left:0; right:0; height:11px;
    background:linear-gradient(90deg,#3b82f6 0%,#6366f1 45%,#8b5cf6 75%,#ec4899 100%); }

  .head { position:relative; text-align:center; flex:0 0 auto; }
  .brandline { display:flex; align-items:center; justify-content:center; gap:16px; }
  .logo { width:62px; height:62px; border-radius:16px; flex:0 0 62px;
    box-shadow:0 6px 18px rgba(15,23,42,.16); }
  .brandtext { text-align:left; }
  .brandtext .name { font-size:31px; font-weight:900; color:#0f172a; letter-spacing:.5px; line-height:1.1; }
  .brandtext .kicker { font-size:15.5px; font-weight:700; color:#64748b; letter-spacing:2.6px; margin-top:4px; }

  h1 { margin-top:24px; font-size:74px; font-weight:900; color:#0f172a;
       line-height:1.12; letter-spacing:-1px; }
  h1 .hl { background:linear-gradient(90deg,#2563eb,#7c3aed);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:18px; font-size:28px; font-weight:500; color:#475569; line-height:1.5; }
  .sub b { color:#1e293b; font-weight:800; }

  .chips { display:flex; gap:12px; margin-top:24px; justify-content:center; }
  .chip { display:flex; align-items:center; gap:8px;
    padding:10px 20px; border-radius:999px; font-size:20px; font-weight:700;
    background:#fff; color:#1e293b; white-space:nowrap;
    border:1.5px solid #dbe3ef; box-shadow:0 2px 8px rgba(15,23,42,.06); }
  .chip .dot { width:11px; height:11px; border-radius:50%; }

  /* ---------- product card ---------- */
  .card { position:relative; width:100%; max-width:860px; margin-top:34px;
    flex:0 0 auto; height:var(--card-h);
    background:#fff; border-radius:24px; border:1px solid #e4eaf3;
    box-shadow:0 30px 64px -24px rgba(15,23,42,.34), 0 6px 16px rgba(15,23,42,.07);
    overflow:hidden; display:flex; flex-direction:column; }
  .card-bar { flex:0 0 52px; background:#f8fafc; border-bottom:1px solid #e8edf5;
    display:flex; align-items:center; gap:10px; padding:0 20px; }
  .card-bar i { width:13px; height:13px; border-radius:50%; display:block; }
  .card-bar .t { margin-left:8px; font-size:16px; font-weight:700; color:#94a3b8; letter-spacing:.6px; }
  .canvas { position:relative; flex:1 1 auto; min-height:0;
    background-image:
      linear-gradient(to right, #f1f2f4 1px, transparent 1px),
      linear-gradient(to bottom, #f1f2f4 1px, transparent 1px);
    background-size:40px 40px; background-color:#fff; }
  .canvas svg { position:absolute; inset:0; width:100%; height:100%; }
  .cardfoot { flex:0 0 auto; padding:16px 20px;
    background:linear-gradient(135deg,#0f172a,#1e293b); color:#cbd5e1;
    font-size:17px; font-weight:600; line-height:1.5; }
  .cardfoot b { color:#fff; }
  .cardfoot .sep { color:#64748b; padding:0 8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="accent"></div>

  <div class="head">
    <div class="brandline">
      <svg class="logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <rect width="256" height="256" rx="50" fill="#f8fafc"/>
        <path d="M 80 100 L 176 100 M 128 100 L 128 160 M 80 160 L 176 160" stroke="#94a3b8" stroke-width="12" fill="none" stroke-linejoin="round"/>
        <rect x="52" y="72" width="56" height="56" rx="8" fill="#1e293b"/>
        <circle cx="176" cy="100" r="28" fill="#1e293b"/>
        <circle cx="80" cy="160" r="28" fill="#ec4899"/>
        <rect x="148" y="132" width="56" height="56" rx="8" fill="#3b82f6"/>
      </svg>
      <div class="brandtext">
        <div class="name">Geno-Link</div>
        <div class="kicker">免費 · 免下載 · 免註冊</div>
      </div>
    </div>

    <h1>線上<span class="hl">家系圖</span>產生器</h1>
    <div class="sub"><b>智慧磁吸排版</b>＋快捷操作工具列<br>30 秒畫完，同步匯出家族結構文字紀錄</div>

    <div class="chips">
      <div class="chip"><span class="dot" style="background:#3b82f6"></span>磁吸自動對齊</div>
      <div class="chip"><span class="dot" style="background:#8b5cf6"></span>30 秒完成</div>
      <div class="chip"><span class="dot" style="background:#ec4899"></span>一鍵匯出</div>
    </div>
  </div>

  <div class="card">
    <div class="card-bar">
      <i style="background:#f87171"></i><i style="background:#fbbf24"></i><i style="background:#34d399"></i>
      <span class="t">家系圖繪製畫布</span>
    </div>
    <div class="canvas">
      <svg viewBox="0 0 820 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#334155" stroke-width="2.8" fill="none">
          <line x1="342" y1="60" x2="478" y2="60"/>
          <line x1="410" y1="60" x2="410" y2="120"/>
          <line x1="316" y1="120" x2="504" y2="120"/>
          <line x1="316" y1="120" x2="316" y2="156"/>
          <line x1="504" y1="120" x2="504" y2="156"/>
          <line x1="316" y1="186" x2="436" y2="186"/>
          <line x1="376" y1="186" x2="376" y2="252"/>
          <line x1="322" y1="252" x2="430" y2="252"/>
          <line x1="322" y1="252" x2="322" y2="286"/>
          <line x1="430" y1="252" x2="430" y2="286"/>
        </g>

        <rect x="274" y="144" width="198" height="202" rx="20"
              fill="rgba(239,68,68,.045)" stroke="#ef4444" stroke-width="2.6" stroke-dasharray="9,7"/>

        <rect x="318" y="36" width="48" height="48" rx="3" fill="#fff" stroke="#334155" stroke-width="3"/>
        <circle cx="478" cy="60" r="24" fill="#fff" stroke="#334155" stroke-width="3"/>

        <rect x="286" y="156" width="60" height="60" rx="4" fill="none" stroke="#2563eb" stroke-width="2.8"/>
        <rect x="292" y="162" width="48" height="48" rx="3" fill="#fff" stroke="#2563eb" stroke-width="3"/>
        <text x="316" y="192" text-anchor="middle" font-family="'Noto Sans TC',sans-serif"
              font-size="15" font-weight="700" fill="#1e293b">案主</text>

        <circle cx="436" cy="186" r="24" fill="#fff" stroke="#334155" stroke-width="3"/>
        <circle cx="504" cy="180" r="24" fill="#fff" stroke="#334155" stroke-width="3"/>
        <line x1="487" y1="163" x2="521" y2="197" stroke="#334155" stroke-width="2.8"/>
        <line x1="521" y1="163" x2="487" y2="197" stroke="#334155" stroke-width="2.8"/>

        <rect x="298" y="286" width="48" height="48" rx="3" fill="#fff" stroke="#334155" stroke-width="3"/>
        <text x="322" y="316" text-anchor="middle" font-family="'Noto Sans TC',sans-serif"
              font-size="15" font-weight="700" fill="#475569">12</text>
        <circle cx="430" cy="310" r="24" fill="#fff" stroke="#334155" stroke-width="3"/>
        <text x="430" y="316" text-anchor="middle" font-family="'Noto Sans TC',sans-serif"
              font-size="15" font-weight="700" fill="#475569">8</text>

        <line x1="150" y1="186" x2="670" y2="186" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="7,7" opacity=".5"/>
        <circle cx="436" cy="186" r="33" fill="none" stroke="#3b82f6" stroke-width="2" opacity=".45"/>
      </svg>
    </div>
    <div class="cardfoot">「案主再婚，與案妻育有<b>1 子 1 女</b>，案長子 12 歲……」<span class="sep">|</span>圖形完成即同步生成<b>家族結構文字紀錄</b></div>
  </div>
</div>
</body>
</html>
